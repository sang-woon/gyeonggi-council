<?xml version="1.0" encoding="UTF-8"?>
<!--
  Android Adaptive Icon foreground — 108×108dp viewport
  안전 영역(중앙 66dp)에만 컨텐츠 배치. 가장자리는 시스템 마스크(원/사각/스쿼클 등)가 처리.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbe4f0"/>
      <stop offset="100%" stop-color="#9aafc8"/>
    </linearGradient>
  </defs>

  <!-- 안전 영역(반지름 33) 내부에 모든 컨텐츠 위치 -->
  <g transform="translate(28,18)">
    <path d="M 0 4
             Q 0 0, 4 0
             L 36 0
             L 52 16
             L 52 70
             Q 52 74, 48 74
             L 4 74
             Q 0 74, 0 70
             Z"
          fill="url(#page)"
          stroke="#cbd5e1"
          stroke-width="0.5"/>
    <path d="M 36 0 L 52 16 L 36 16 Z"
          fill="url(#fold)"
          stroke="#94a3b8"
          stroke-width="0.5"/>
    <text x="26" y="50"
          font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif"
          font-size="34"
          font-weight="800"
          text-anchor="middle"
          fill="#1e3a8a">한</text>
    <rect x="8"  y="58" width="36" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="8"  y="62" width="28" height="2" rx="1" fill="#cbd5e1"/>
    <rect x="8"  y="66" width="34" height="2" rx="1" fill="#cbd5e1"/>
  </g>
</svg>
